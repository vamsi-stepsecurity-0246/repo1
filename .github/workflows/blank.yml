      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.stepsecurity.io/javascript/
          package-manager-cache: false

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.STEPSECURITY_NPM_TOKEN }}

      - name: Test lodash
        run: node -e "console.log(require('lodash').capitalize('hello stepsecurity'))"
